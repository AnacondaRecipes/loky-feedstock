{% set name = "loky" %}
{% set version = "3.6.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 12c1655148c369dd1739a514a4f5b01b76538ffead916f9ad442ef6c0e9be896

# Upstream source:
# https://github.com/joblib/loky/blob/3.6.0/pyproject.toml
build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools >=61.2
  run:
    - python
    - cloudpickle

# Tests randomly handing without any reason.
{% set ignore_tests = " --ignore=tests/test_loky_module.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_loky_backend.py" %}

# Failed for osx on CI only
# OSError: [Errno 24] Too many open files
{% set tests_to_skip = " test_no_crash_max_workers_on_windows" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_notify" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_notify_all" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_timeout" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_waitfor" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_wait_result" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_event" %}  # [osx]
{% set tests_to_skip = tests_to_skip + " or test_worker_timeout_mock" %}  # [osx]
# Failed: DID NOT WARN. No warnings of type (<class 'UserWarning'>,) were emitted.
{% set tests_to_skip = tests_to_skip + " or test_worker_timeout_with_slowly_pickling_objects" %}  # [osx]


test:
  source_files:
    - tests
  imports:
    - loky
    - loky._base
    - loky.backend
    - loky.backend.context
    - loky.backend.queues
    - loky.backend.reduction
    - loky.backend.resource_tracker
    - loky.backend.utils
    - loky.process_executor
    - loky.reusable_executor
  requires:
    - pip
    - pytest
    - cloudpickle
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -vv tests {{ ignore_tests }}  # [not osx]
    - pytest -vv tests {{ ignore_tests }} -k "not ({{ tests_to_skip }})"  # [osx]

about:
  home: https://github.com/joblib/loky
  dev_url: https://github.com/joblib/loky
  doc_url: https://loky.readthedocs.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Robust and reusable Executor for joblib
  description: |
    A robust, cross-platform and cross-version implementation of
    concurrent.futures.ProcessPoolExecutor with many features.

extra:
  recipe-maintainers:
    - jakirkham
    - tomMoral
    - ogrisel
    - pierreglaser
