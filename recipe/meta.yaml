{% set name = "loky" %}
{% set version = "3.5.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: d96935ed689aa53eeb7b329769544950fa10a52706968f5d0af3d9c33a761e77

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<39]

requirements:
  host:
    - python
    - pip
    - setuptools >=61.2
    - cython
  run:
    - python
    - cloudpickle
  build:
    - {{ compiler('c') }}

test:
  imports:
    - loky
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/joblib/loky
  dev_url: https://github.com/joblib/loky
  doc_url: https://loky.readthedocs.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Robust and reusable Executor for joblib
  description: |
    A robust, cross-platform and cross-version implementation of
    concurrent.futures.ProcessPoolExecutor with many features.



extra:
  recipe-maintainers:
    - jakirkham
    - tomMoral
    - ogrisel
    - pierreglaser
