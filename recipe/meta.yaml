{% set name = "loky" %}
{% set version = "3.6.0" %}
{% set ignore_tests = " --ignore=tests/test_loky_module.py" %}
{% set ignore_tests = ignore_tests + " --ignore=tests/test_loky_backend.py" %}

# Tests randomly handing without any reason.
package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 12c1655148c369dd1739a514a4f5b01b76538ffead916f9ad442ef6c0e9be896

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - setuptools >=61.2
    - cython
  run:
    - python
    - cloudpickle
  build:
    - {{ compiler('c') }}

test:
  source_files:
    - tests
  imports:
    - loky
    - loky._base
    - loky.backend
    - loky.backend.context
    - loky.backend.queues
    - loky.backend.reduction
    - loky.backend.resource_tracker
    - loky.backend.utils
    - loky.process_executor
    - loky.reusable_executor
  requires:
    - pip
    - pytest
    - cloudpickle
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests {{ ignore_tests }}

about:
  home: https://github.com/joblib/loky
  dev_url: https://github.com/joblib/loky
  doc_url: https://loky.readthedocs.io
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Robust and reusable Executor for joblib
  description: |
    A robust, cross-platform and cross-version implementation of
    concurrent.futures.ProcessPoolExecutor with many features.











extra:
  recipe-maintainers:
    - jakirkham
    - tomMoral
    - ogrisel
    - pierreglaser
